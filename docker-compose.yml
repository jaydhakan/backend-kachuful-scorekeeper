# Local development only: Postgres 16 on host port 5433 (5432 is often taken by a local Postgres).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kachuful
      POSTGRES_PASSWORD: kachuful
      POSTGRES_DB: kachuful
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/initdb.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kachuful -d kachuful"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
