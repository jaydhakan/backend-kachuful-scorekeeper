# Staging: the production app build (same-origin /api) in front of the staging API on port 8001.
server {
    listen 443 ssl http2;
    server_name staging.play.vectanix.com;

    ssl_certificate     /etc/letsencrypt/live/staging.play.vectanix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.play.vectanix.com/privkey.pem;

    root /var/www/play;
    index index.html;
    location / { try_files $uri /index.html; }

    gzip on;
    gzip_types application/json image/svg+xml text/event-stream;
    gzip_min_length 512;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location ~ ^/api/public/live/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(r|l)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name staging.play.vectanix.com;
    return 301 https://$host$request_uri;
}
