# Paste inside the existing `server { ... }` block for play.vectanix.com (port 8000 = production).
# For staging, use deploy/nginx/staging.play.vectanix.com.conf instead (port 8001).

gzip on;
gzip_types application/json image/svg+xml text/event-stream;
gzip_min_length 512;

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}

# Player photos: up to 2 MB before the API re-encodes them to ~60 KB.
location ~ ^/api/players/[^/]+/photo$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
}

# Live tables: no buffering, long reads (the API pings every 25 s).
location ~ ^/api/public/live/[^/]+/events$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Content-Type-Options nosniff always;
}

# Link previews for WhatsApp: tiny HTML pages that redirect into the app.
location ~ ^/(r|l)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
}
